<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d4c">
<title>Vogelmatch — welke vogel past bij jou?</title>
<style>
:root{
  --bg:#e6ece2; --card:#fafcf7; --ink:#1b2922; --muted:#5a6a61; --line:#cbd6c6;
  --leaf:#2f5d4c; --leaf-2:#dce8df; --gold:#d9960f; --gold-2:#fbefd2; --alert:#b0402c; --alert-2:#f7e1db;
  --branch:#8a6a4a; --plate:#f3f6ef;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#121a16; --card:#1b2520; --ink:#e7eee6; --muted:#9db0a4; --line:#2e3c35;
  --leaf:#86c4a0; --leaf-2:#203229; --gold:#f0b440; --gold-2:#33291a; --alert:#e6826a; --alert-2:#3a231d;
  --branch:#7a5e44; --plate:#e9eee5; } }
:root[data-theme="dark"]{ --bg:#121a16; --card:#1b2520; --ink:#e7eee6; --muted:#9db0a4; --line:#2e3c35;
  --leaf:#86c4a0; --leaf-2:#203229; --gold:#f0b440; --gold-2:#33291a; --alert:#e6826a; --alert-2:#3a231d; --branch:#7a5e44; --plate:#e9eee5; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 var(--sans); -webkit-font-smoothing:antialiased; }
#app{ max-width:680px; margin:0 auto; padding:20px 18px 64px; }
h1,h2,h3,h4{ font-family:var(--serif); font-weight:600; line-height:1.15; margin:0 0 .5em; }
h1{ font-size:clamp(2rem,7vw,2.75rem); letter-spacing:-.01em; }
h2{ font-size:clamp(1.45rem,5vw,1.85rem); }
h3{ font-size:1.18rem; }
h4{ font-size:1rem; margin-top:1.2em; }
p{ margin:0 0 1em; }
button{ font:inherit; color:inherit; cursor:pointer; }
:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
.btn{ display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border:1.5px solid var(--leaf); background:transparent; color:var(--leaf); padding:13px 20px; border-radius:14px; font-weight:600; min-height:48px; }
.btn small{ font-weight:400; font-size:.8rem; opacity:.85; }
.btn.primary{ background:var(--leaf); color:var(--card); }
.btn[disabled]{ opacity:.4; cursor:not-allowed; }
.link{ background:none; border:0; color:var(--leaf); text-decoration:underline; text-underline-offset:3px; padding:10px 0; }
.link.danger{ color:var(--alert); }
.savedrow{ display:flex; flex-direction:column; align-items:center; }
.icon.stop{ font-size:.95rem; color:var(--muted); }
.armed{ color:var(--alert)!important; border-color:var(--alert)!important; font-weight:600; }
.icon.armed{ width:auto; padding:0 12px; border-radius:21px; font-size:.85rem; }
.btn.mine{ width:100%; max-width:380px; margin:6px auto 4px; }
.savedbar{ background:var(--leaf-2); border-radius:12px; padding:10px 14px; font-size:.92rem; } .savedbar a{ color:var(--leaf); }
.link.back{ padding:0 0 10px; }
.entry .en-head{ display:flex; gap:12px; align-items:center; margin-bottom:8px; }
.en-plate{ width:64px; flex:none; background:var(--plate); border:1px solid var(--line); border-radius:8px; padding:2px; }
.en-meta h3{ margin:0 0 2px; } .en-meta .fine{ margin:0; }
.en-top{ margin:0 0 10px; padding-left:1.3em; } .en-top span{ color:var(--muted); font-size:.88rem; }
.en-note{ background:var(--bg); border-radius:10px; padding:10px 12px; white-space:pre-wrap; font-size:.92rem; }
.en-act{ display:flex; gap:14px; align-items:center; } .en-act .btn{ min-height:42px; padding:8px 18px; }
.nlabel{ display:block; font-size:.85rem; font-weight:600; margin:10px 0 4px; }
.ninput{ width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; }
textarea.ninput{ resize:vertical; min-height:120px; line-height:1.5; }
.ninput:focus{ border-color:var(--leaf); outline:none; box-shadow:0 0 0 3px var(--leaf-2); }
.fine{ font-size:.86rem; color:var(--muted); }
.sub{ color:var(--muted); }

/* Start */
.start{ text-align:center; padding-top:8px; }
.plates{ position:relative; height:210px; margin:0 auto 14px; max-width:380px; }
.plate{ background:var(--plate); border:1px solid var(--line); border-radius:6px; box-shadow:0 1px 0 var(--line), 0 10px 24px -14px rgba(20,40,30,.45); padding:8px; }
.plates .plate{ position:absolute; width:150px; top:12px; }
.plates .p0{ left:6%; transform:rotate(-8deg); }
.plates .p1{ left:calc(50% - 75px); top:0; z-index:2; }
.plates .p2{ right:6%; transform:rotate(7deg); }
.lede{ font-size:1.05rem; max-width:34em; margin:0 auto 1.4em; }
.cta{ display:grid; gap:10px; max-width:380px; margin:0 auto 10px; }

/* Quiz */
.qhead{ display:flex; align-items:center; gap:12px; margin-bottom:6px; }
.icon{ border:1px solid var(--line); background:var(--card); width:42px; height:42px; border-radius:50%; font-size:1.1rem; }
.sec{ font-size:.9rem; color:var(--muted); flex:1; }
.count{ font-size:.85rem; color:var(--muted); font-variant-numeric:tabular-nums; }
.branch{ position:relative; height:30px; margin:4px 4px 22px; }
.twig{ position:absolute; left:0; right:0; top:19px; height:5px; border-radius:3px; background:var(--branch); opacity:.55; }
.perch{ position:absolute; top:0; font-size:20px; transition:left .45s cubic-bezier(.3,.7,.3,1); }
.opts{ display:grid; gap:10px; }
.opt{ display:flex; gap:14px; align-items:center; text-align:left; background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:14px 16px; min-height:60px; }
.opt .em{ font-size:1.6rem; width:34px; text-align:center; flex:none; }
.opt b{ display:block; font-weight:600; }
.opt small{ display:block; color:var(--muted); font-size:.86rem; margin-top:2px; }
.opt:hover{ border-color:var(--leaf); }
.opt.sel{ border-color:var(--leaf); background:var(--leaf-2); }
.chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
.chip{ border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:10px 15px; min-height:44px; }
.chip.sel{ border-color:var(--leaf); background:var(--leaf); color:var(--card); }
.next{ width:100%; }
.slider{ background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:20px 18px 14px; margin-bottom:18px; }
.slider output{ display:block; font-family:var(--serif); font-size:1.35rem; font-weight:600; min-height:1.6em; }
.sdesc{ color:var(--muted); font-size:.92rem; min-height:2.6em; margin:6px 0 0; }
input[type=range]{ width:100%; accent-color:var(--leaf); height:36px; }
.sl-ends{ display:flex; justify-content:space-between; font-size:.8rem; color:var(--muted); }

/* Insight / reality */
.insight{ text-align:center; padding-top:40px; }
.insight .bulb{ font-size:2.6rem; margin-bottom:8px; }
.insight p{ font-size:1.1rem; max-width:30em; margin:0 auto 1.6em; }
.reality h2{ margin-top:12px; }
.rlist{ list-style:none; padding:0; margin:0 0 22px; display:grid; gap:10px; }
.rlist li{ background:var(--card); border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:10px; padding:12px 14px; }
.reality .btn{ width:100%; }

/* Results */
.rank{ display:flex; gap:8px; overflow-x:auto; padding:4px 2px 12px; margin:0 -2px 6px; scroll-snap-type:x mandatory; }
.rk{ flex:0 0 auto; scroll-snap-align:start; display:grid; grid-template-columns:auto auto; grid-template-rows:auto auto; align-items:center; column-gap:8px; background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:7px 12px 7px 10px; text-align:left; max-width:200px; }
.rk .md{ grid-row:1/3; font-size:1.05rem; }
.rk svg.mini{ display:none; }
.rk .rn{ font-size:.85rem; font-weight:600; line-height:1.2; grid-column:2; grid-row:1; }
.rk .rs{ font-size:.8rem; color:var(--muted); grid-column:2; grid-row:2; }
.rk.sel{ border-color:var(--leaf); background:var(--leaf-2); }
.hero{ display:grid; grid-template-columns:minmax(0,1fr); gap:14px; margin:6px 0 16px; }
.plate.big{ max-width:320px; width:100%; margin:0 auto; }
@media (min-width:620px){ .hero{ grid-template-columns:260px 1fr; align-items:center; } .plate.big{ margin:0; } }
.rankline{ font-size:.9rem; color:var(--muted); margin-bottom:4px; }
.hero h1{ font-size:clamp(1.9rem,6.4vw,2.5rem); margin-bottom:4px; }
.sci{ font-style:italic; color:var(--muted); margin-bottom:12px; } .sci .cm{ font-style:normal; margin-left:.6em; }
.seal{ display:inline-flex; align-items:baseline; gap:6px; border:2px solid var(--gold); color:var(--ink); background:var(--gold-2); border-radius:999px; padding:4px 14px; margin-bottom:10px; }
.seal b{ font-family:var(--serif); font-size:1.5rem; }
.tag{ font-family:var(--serif); font-size:1.15rem; font-style:italic; margin:0; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:12px; }
.card.accent{ border-color:var(--leaf); box-shadow:inset 4px 0 0 var(--leaf); }
.two{ display:grid; gap:12px; } .two .card{ margin:0; }
@media (min-width:620px){ .two{ grid-template-columns:1fr 1fr; } }
.two{ margin-bottom:12px; }
.ticks{ list-style:none; padding:0; margin:0; display:grid; gap:8px; }
.ticks li{ line-height:1.45; }
.facts{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
.facts div{ background:var(--bg); border-radius:10px; padding:9px 11px; }
.facts span{ display:block; font-size:.78rem; color:var(--muted); }
.facts b{ font-family:var(--serif); font-size:1.05rem; }
.meters{ display:grid; grid-template-columns:auto 1fr auto 1fr; gap:8px 10px; align-items:center; margin:0 0 10px; font-size:.88rem; }
.meters dd{ margin:0; }
@media (max-width:420px){ .meters{ grid-template-columns:auto 1fr; } }
.pips{ display:inline-flex; gap:3px; }
.pips i{ width:13px; height:13px; border-radius:50% 50% 50% 2px; transform:rotate(45deg); background:var(--line); }
.pips i.on{ background:var(--leaf); }
.callout{ background:var(--gold-2); border-radius:12px; padding:12px 14px; margin:0 0 12px; }
.callout.warn{ background:var(--alert-2); }
.lvl{ font-family:var(--sans); font-size:.75rem; font-weight:600; border-radius:999px; padding:2px 9px; vertical-align:middle; margin-left:6px; }
.lvl.goed{ background:var(--leaf-2); color:var(--leaf); } .lvl.letop{ background:var(--gold-2); color:var(--gold); } .lvl.risico{ background:var(--alert-2); color:var(--alert); }
.day{ list-style:none; padding:0; margin:0 0 10px; display:grid; gap:8px; }
.seg{ display:inline-flex; border:1.5px solid var(--leaf); border-radius:12px; overflow:hidden; margin-bottom:12px; }
.seg button{ border:0; background:transparent; padding:9px 14px; min-height:42px; }
.seg button.sel{ background:var(--leaf); color:var(--card); }
.muts{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; }
.muts button{ background:var(--plate); border:1.5px solid var(--line); border-radius:10px; padding:4px 4px 8px; color:#26332c; font-size:.8rem; }
.muts button.sel{ border-color:var(--gold); box-shadow:0 0 0 2px var(--gold); }
.muts svg{ display:block; width:100%; height:auto; }
details summary{ font-family:var(--serif); font-weight:600; font-size:1.12rem; cursor:pointer; list-style-position:inside; }
details[open] summary{ margin-bottom:10px; }
table{ width:100%; border-collapse:collapse; font-size:.88rem; }
th,td{ text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
td small{ display:block; color:var(--muted); }
th:nth-child(n+2),td:nth-child(n+2){ text-align:right; white-space:nowrap; }
.src{ padding-left:1.2em; font-size:.88rem; } .src a{ color:var(--leaf); word-break:break-word; }
.actions{ display:grid; gap:10px; margin-top:20px; }
@media (min-width:620px){ .actions{ grid-template-columns:1fr 1fr 1fr; } .actions .link{ grid-column:1/-1; } }
svg.bird{ display:block; width:100%; height:auto; }
.reveal{ animation:plate .7s cubic-bezier(.2,.8,.2,1) both; }
@keyframes plate{ from{ opacity:0; transform:translateY(10px) rotate(-2deg); } to{ opacity:1; transform:none; } }
#toast{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,30px); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; opacity:0; pointer-events:none; transition:.25s; font-size:.92rem; z-index:9; }
#toast.on{ opacity:1; transform:translate(-50%,0); }
@media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }
@media print{ .rank,.actions,.seg,.muts,#toast{ display:none!important; } details{ display:block; } body{ background:#fff; } }
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status"></div>
<script src="src/data.js"></script>
<script src="src/questions.js"></script>
<script src="src/engine.js"></script>
<script src="src/app.js"></script>
</body>
</html>
